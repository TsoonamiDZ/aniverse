# Fly.io config — deploy with: fly launch && fly volumes create data && fly deploy
app = "aniverse"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_stop_machines = false

# Persistent volume mounted at /data — the SQLite DB lives here so writes
# (sync tool) survive redeploys. Create it once: `fly volumes create data --size 1`
[[mounts]]
  source = "data"
  destination = "/data"
