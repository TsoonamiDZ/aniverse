# Fly.io config — deploy with: fly launch && fly volumes create data && fly deploy
app = "aniverse"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[mounts]]
  source = "data"
  destination = "/data"
